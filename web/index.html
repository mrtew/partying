<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Partying App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 { font-size: 2rem; margin-bottom: 4px; }
    p.sub { color: #aaa; margin-bottom: 24px; font-size: 0.9rem; }

    /* ── Login Screen ── */
    #login-screen {
      background: #1a1a2e;
      padding: 40px;
      border-radius: 16px;
      width: 360px;
      text-align: center;
    }

    #login-screen input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0f0f1a;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 12px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }

    #login-btn {
      width: 100%;
      background: linear-gradient(135deg, #7c3aed, #db2777);
      color: #fff;
      padding: 14px;
      font-size: 1rem;
    }

    /* ── App Screen ── */
    #app-screen {
      display: none;
      width: 900px;
      height: 90vh;
      background: #1a1a2e;
      border-radius: 16px;
      overflow: hidden;
      flex-direction: row;
    }

    /* Left panel: rooms */
    #left-panel {
      width: 280px;
      background: #12122a;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2a2a4a;
    }

    #left-panel .panel-header {
      padding: 16px;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #left-panel .panel-header span { font-weight: 700; font-size: 1rem; }

    #create-room-btn {
      background: #7c3aed;
      color: #fff;
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    #rooms-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .room-item {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      background: #1a1a3a;
      transition: background 0.15s;
    }

    .room-item:hover { background: #252550; }
    .room-item.active { background: #7c3aed33; border-left: 3px solid #7c3aed; }

    .room-item .room-name { font-weight: 600; font-size: 0.95rem; }
    .room-item .room-meta { font-size: 0.75rem; color: #888; margin-top: 2px; }

    /* Right panel: chat */
    #right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #chat-header {
      padding: 16px;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #chat-header .room-title { font-weight: 700; font-size: 1.1rem; }
    #chat-header .room-users-badge {
      font-size: 0.8rem;
      background: #2a2a4a;
      padding: 4px 10px;
      border-radius: 99px;
      color: #aaa;
    }

    #users-in-room {
      padding: 10px 16px;
      font-size: 0.8rem;
      color: #7c3aed;
      background: #7c3aed11;
      border-bottom: 1px solid #2a2a4a;
      min-height: 36px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .msg.mine {
      align-self: flex-end;
      background: #7c3aed;
    }

    .msg.others {
      align-self: flex-start;
      background: #2a2a4a;
    }

    .msg .sender {
      font-size: 0.72rem;
      color: #ccc;
      margin-bottom: 3px;
      font-weight: 600;
    }

    .msg.system {
      align-self: center;
      background: transparent;
      color: #888;
      font-size: 0.8rem;
      font-style: italic;
    }

    #chat-input-row {
      display: flex;
      padding: 12px 16px;
      gap: 10px;
      border-top: 1px solid #2a2a4a;
    }

    #chat-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0f0f1a;
      color: #fff;
      font-size: 0.95rem;
    }

    #send-btn {
      background: #7c3aed;
      color: #fff;
      padding: 12px 20px;
    }

    #leave-btn {
      background: #991b1b;
      color: #fff;
      padding: 6px 14px;
      font-size: 0.8rem;
    }

    #user-badge {
      padding: 12px 16px;
      border-top: 1px solid #2a2a4a;
      font-size: 0.85rem;
      color: #888;
    }

    #user-badge span { color: #7c3aed; font-weight: 700; }

    .empty-state {
      text-align: center;
      color: #555;
      padding: 40px;
      font-size: 0.9rem;
    }

    #no-room-msg {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

<!-- ── Login Screen ── -->
<div id="login-screen">
  <h1>🎉 Partying</h1>
  <p class="sub">Join the party. Just enter your username.</p>
  <input id="username-input" type="text" placeholder="Your username" maxlength="20"/>
  <input id="password-input" type="password" placeholder="Password (min 6 chars)"/>
  <button id="login-btn">Enter the Party 🚀</button>
  <p id="login-error" style="color:#f87171;margin-top:12px;font-size:0.85rem;"></p>
</div>

<!-- ── App Screen ── -->
<div id="app-screen">
  <!-- Left: Room List -->
  <div id="left-panel">
    <div class="panel-header">
      <span>🎙️ Party Rooms</span>
      <button id="create-room-btn">+ New</button>
    </div>
    <div id="rooms-list">
      <div class="empty-state">No rooms yet.<br/>Create one!</div>
    </div>
    <div id="user-badge">Logged in as <span id="username-display"></span></div>
  </div>

  <!-- Right: Chat -->
  <div id="right-panel">
    <div id="chat-header">
      <span class="room-title" id="current-room-name">Select a room</span>
      <div style="display:flex;gap:8px;align-items:center;">
        <span class="room-users-badge" id="user-count">0 in room</span>
        <button id="leave-btn" style="display:none;" onclick="leaveRoom()">Leave</button>
      </div>
    </div>
    <div id="users-in-room">👥 Nobody here yet</div>
    <div id="messages">
      <div id="no-room-msg">← Join a room to start chatting</div>
    </div>
    <div id="chat-input-row">
      <input id="chat-input" type="text" placeholder="Type a message... (Enter to send)" disabled/>
      <button id="send-btn" disabled>Send</button>
    </div>
  </div>
</div>

<script>
  // ── State ──
  let token = '';
  let currentUser = '';
  let currentUserID = '';
  let currentRoomID = '';
  let ws = null;

  // ── DOM refs ──
  const loginScreen  = document.getElementById('login-screen');
  const appScreen    = document.getElementById('app-screen');
  const loginError   = document.getElementById('login-error');
  const roomsList    = document.getElementById('rooms-list');
  const messages     = document.getElementById('messages');
  const chatInput    = document.getElementById('chat-input');
  const sendBtn      = document.getElementById('send-btn');
  const leaveBtn     = document.getElementById('leave-btn');
  const noRoomMsg    = document.getElementById('no-room-msg');
  const usersInRoom  = document.getElementById('users-in-room');
  const userCount    = document.getElementById('user-count');
  const currentRoomName = document.getElementById('current-room-name');

  // ── Login ──
  document.getElementById('login-btn').onclick = async () => {
    const username = document.getElementById('username-input').value.trim();
    const password = document.getElementById('password-input').value.trim();
    if (!username || !password) {
      loginError.textContent = 'Please enter username and password.';
      return;
    }

    // 先尝试注册，失败了再登录（方便demo）
    try {
      await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
    } catch (_) {}

    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();
    if (!data.success) {
      loginError.textContent = data.message || 'Login failed.';
      return;
    }

    token = data.data.token;
    currentUser = data.data.user.username;
    currentUserID = data.data.user.id;

    document.getElementById('username-display').textContent = currentUser;
    loginScreen.style.display = 'none';
    appScreen.style.display   = 'flex';

    connectWebSocket();
    loadRooms();
  };

  // Enter key to login
  document.getElementById('password-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('login-btn').click();
  });

  // ── WebSocket ──
  function connectWebSocket() {
    ws = new WebSocket(`ws://${location.host}/ws`);

    // 注意：浏览器WebSocket API不支持自定义header
    // 我们在连接后立刻发一个auth消息，服务器需要支持
    // 更简单的方案：把token放在URL query参数里
    // 所以我们用下面这个方式重连
    ws.close();
    ws = new WebSocket(`ws://${location.host}/ws?token=${token}`);

    ws.onopen = () => {
      console.log('✅ WebSocket connected');
    };

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      handleWSMessage(msg);
    };

    ws.onclose = () => {
      console.log('WebSocket disconnected');
    };

    ws.onerror = (err) => {
      console.error('WebSocket error:', err);
    };
  }

  function handleWSMessage(msg) {
    switch (msg.type) {
      case 'room_joined':
        currentRoomID = msg.payload.room_id;
        addSystemMessage(`You joined the room!`);
        chatInput.disabled = false;
        sendBtn.disabled   = false;
        leaveBtn.style.display = 'block';
        break;

      case 'room_left':
        currentRoomID = '';
        addSystemMessage('You left the room.');
        chatInput.disabled = true;
        sendBtn.disabled   = true;
        leaveBtn.style.display = 'none';
        usersInRoom.textContent = '👥 Nobody here yet';
        userCount.textContent   = '0 in room';
        break;

      case 'user_joined':
        addSystemMessage(`${msg.payload.username} joined the party 🎉`);
        loadRooms();
        break;

      case 'user_left':
        addSystemMessage(`${msg.payload.username} left the party`);
        loadRooms();
        break;

      case 'new_message':
        addChatMessage(msg.payload.username, msg.payload.content, msg.payload.user_id === currentUserID);
        break;

      case 'room_users':
        const users = msg.payload.users || [];
        userCount.textContent   = `${users.length} in room`;
        usersInRoom.textContent = '👥 ' + (users.length ? users.join(', ') : 'Nobody here yet');
        break;

      case 'error':
        addSystemMessage(`⚠️ ${msg.payload.message}`);
        break;
    }
  }

  // ── Rooms ──
  async function loadRooms() {
    const res  = await fetch('/api/rooms', { headers: { Authorization: `Bearer ${token}` } });
    const data = await res.json();
    if (!data.success) return;

    const rooms = data.data || [];
    if (rooms.length === 0) {
      roomsList.innerHTML = '<div class="empty-state">No rooms yet.<br/>Create one!</div>';
      return;
    }

    roomsList.innerHTML = rooms.map(room => `
      <div class="room-item ${room.id === currentRoomID ? 'active' : ''}"
           onclick="joinRoom('${room.id}', '${room.name}')">
        <div class="room-name">🎙️ ${room.name}</div>
        <div class="room-meta">${room.current_users}/${room.max_capacity} people</div>
      </div>
    `).join('');
  }

  function joinRoom(roomID, roomName) {
    if (roomID === currentRoomID) return;
    currentRoomName.textContent = roomName;
    messages.innerHTML = '';
    noRoomMsg && noRoomMsg.remove();
    ws.send(JSON.stringify({ type: 'join_room', room_id: roomID }));
    loadRooms();
  }

  function leaveRoom() {
    if (!currentRoomID) return;
    ws.send(JSON.stringify({ type: 'leave_room', room_id: currentRoomID }));
    currentRoomName.textContent = 'Select a room';
    loadRooms();
  }

  document.getElementById('create-room-btn').onclick = async () => {
    const name = prompt('Room name:');
    if (!name || !name.trim()) return;

    const res = await fetch('/api/rooms', {
      method: 'POST',
      headers: {
        'Content-Type':  'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ name: name.trim(), max_capacity: 10 })
    });

    const data = await res.json();
    if (data.success) {
      loadRooms();
      joinRoom(data.data.id, data.data.name);
    } else {
      alert('Failed to create room: ' + data.message);
    }
  };

  // ── Chat ──
  sendBtn.onclick = sendMessage;
  chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });

  function sendMessage() {
    const content = chatInput.value.trim();
    if (!content || !currentRoomID) return;
    ws.send(JSON.stringify({ type: 'chat_message', room_id: currentRoomID, content }));
    chatInput.value = '';
  }

  function addChatMessage(username, content, isMine) {
    const div = document.createElement('div');
    div.className = `msg ${isMine ? 'mine' : 'others'}`;
    div.innerHTML = `<div class="sender">${username}</div><div>${escapeHtml(content)}</div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function addSystemMessage(text) {
    const div = document.createElement('div');
    div.className = 'msg system';
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function escapeHtml(text) {
    return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // 每5秒刷新一次房间列表
  setInterval(loadRooms, 5000);
</script>
</body>
</html>
